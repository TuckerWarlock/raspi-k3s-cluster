apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
spec:
  project: default
  sources:
    # Upstream Helm chart
    # OCI registry (see cluster/argocd/config/repo-victoriametrics-oci.yaml for why)
    - repoURL: ghcr.io/victoriametrics/helm-charts
      chart: victoria-metrics-single
      targetRevision: 0.50.0
      helm:
        valueFiles:
          - $values/cluster/monitoring/victoria-metrics/values.yaml
    # Git ref that provides $values for the valueFiles path above
    - repoURL: https://github.com/TuckerWarlock/raspi-k3s-cluster
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
