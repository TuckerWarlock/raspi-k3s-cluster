apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Core infrastructure — managed by ArgoCD via Helm (multi-source Applications)
  - metallb.yaml
  - metallb-config.yaml
  - traefik.yaml
  # Monitoring — VictoriaMetrics single-node (values in cluster/monitoring/victoria-metrics/)
  - victoria-metrics.yaml
  # Alerting — vmalert + Alertmanager → ntfy (values in cluster/monitoring/vmalert/)
  - vmalert.yaml
  # Kubernetes object state for the vmalert "kubernetes" rules (values in cluster/monitoring/kube-state-metrics/)
  - kube-state-metrics.yaml
  # ArgoCD own config (ingress, etc.) — managed by ArgoCD
  - argocd-config.yaml
  # User workloads root app — manages cluster/argocd/workloads/
  - workloads.yaml
