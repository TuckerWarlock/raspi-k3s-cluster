apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
spec:
  project: default
  sources:
    # Upstream Helm chart
    # OCI registry (see cluster/argocd/config/repo-prometheus-community-oci.yaml)
    - repoURL: ghcr.io/prometheus-community/charts
      chart: kube-state-metrics
      targetRevision: 9.0.0
      helm:
        valueFiles:
          - $values/cluster/monitoring/kube-state-metrics/values.yaml
    # Git ref that provides $values for the valueFiles path above
    - repoURL: https://github.com/TuckerWarlock/raspi-k3s-cluster
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
