# Public OCI Helm registry for prometheus-community charts (kube-state-metrics). OCI pulls
# fetch only the chart, not a multi-MB index.yaml — see repo-victoriametrics-oci.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: repo-prometheus-community-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: prometheus-community-oci
  type: helm
  url: ghcr.io/prometheus-community/charts
  enableOCI: "true"
