service:
  type: LoadBalancer

# Pin Traefik to the controller — Pi Zeros don't have enough RAM
nodeSelector:
  kubernetes.io/hostname: pi4controller

# Resource limits — unbounded Traefik can grow to 100Mi+ under load
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

logs:
  access:
    enabled: true

# Expose the dashboard via IngressRoute on /dashboard
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web

ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443

# Use the mkcert wildcard cert as the default TLS certificate for all *.cluster.local routes.
# The secret must exist in the traefik namespace before ArgoCD syncs this.
# To create it (run once, and again after any reflash):
#   mkcert "*.cluster.local"
#   kubectl create secret tls cluster-local-tls \
#     --cert=_wildcard.cluster.local.pem \
#     --key=_wildcard.cluster.local-key.pem \
#     -n traefik
tlsStore:
  default:
    defaultCertificate:
      secretName: cluster-local-tls
