# kube-state-metrics: Kubernetes object state (pod restarts, replica counts, node conditions)
# for the "kubernetes" alert group in cluster/monitoring/vmalert/values.yaml.
# Kept deliberately small — VictoriaMetrics runs near its memory limit.
# Upstream values:
#   helm show values oci://ghcr.io/prometheus-community/charts/kube-state-metrics --version 9.0.0

# No prometheus.io/scrape annotation: the generic service-endpoints job would drop it (no
# prometheus.io/port annotation) and rename its namespace/pod/node labels to exported_*.
# VictoriaMetrics scrapes it with a dedicated honor_labels job instead
# (extraScrapeConfigs in cluster/monitoring/victoria-metrics/values.yaml).
prometheusScrape: false

# Watch only what the alerts use (chart default is 28 resource types)
collectors:
  - pods
  - deployments
  - statefulsets
  - daemonsets
  - nodes
  - persistentvolumeclaims

# Expose only the metrics the alert rules use — a few hundred series instead of thousands.
# Names checked against docs/metrics/ for kube-state-metrics v2.20.0.
metricAllowlist:
  - kube_pod_info
  - kube_pod_status_phase
  - kube_pod_status_ready
  - kube_pod_container_status_waiting_reason
  - kube_pod_container_status_restarts_total
  - kube_deployment_spec_replicas
  - kube_deployment_status_replicas_available
  - kube_statefulset_replicas
  - kube_statefulset_status_replicas_ready
  - kube_daemonset_status_desired_number_scheduled
  - kube_daemonset_status_number_ready
  - kube_node_status_condition
  - kube_persistentvolumeclaim_status_phase

# Needs neither the LAN nor USB storage, so it runs on a Pi Zero and leaves the controller alone
nodeSelector:
  node-role.kubernetes.io/worker: worker

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
