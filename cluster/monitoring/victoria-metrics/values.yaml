server:
  # 14 days is plenty for a home cluster and keeps the PVC small
  retentionPeriod: 14d

  # Pin to the controller — Pi Zeros don't have the RAM, and local-path puts the PVC on USB here
  nodeSelector:
    kubernetes.io/hostname: pi4controller

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  extraArgs:
    # Cap internal caches so VM stays inside its 256Mi limit
    memory.allowedBytes: 160MiB
    # A query touching more series than this fails with an error instead of OOM-killing
    # the pod (a count() over all ~170k series did exactly that). ~50k remain after the
    # relabel drops below.
    search.maxUniqueTimeseries: "60000"
    # The chart doesn't restart the pod when the scrape ConfigMap changes; re-read it every
    # minute so scrape-config edits apply without a restart
    promscrape.configCheckInterval: 1m

  persistentVolume:
    enabled: true
    storageClassName: local-path
    size: 5Gi

  # Drop high-cardinality series nothing here uses, before they're stored. K3s exposes the
  # whole control plane through the API server endpoint, and its latency histograms were
  # ~121k of ~170k series (Nov 2026). The _count/_sum series are kept, so average
  # latencies are still available; only the per-bucket breakdowns go.
  relabel:
    enabled: true
    config:
      - action: drop
        source_labels: [__name__]
        regex: "(apiserver|etcd|scheduler|workqueue|storage_operation|kubelet_runtime_operations|rest_client|authentication|authorization|aggregator|apiextensions|field_validation)_.+_bucket"
      # Static feature-gate flags (~1.5k series) — check `kubectl get --raw /metrics` instead
      - action: drop
        source_labels: [__name__]
        regex: "kubernetes_feature_enabled"

  # Built-in Kubernetes scrape config: API server, kubelet, cAdvisor, and any
  # pod/service annotated prometheus.io/scrape: "true"
  scrape:
    enabled: true
    # kube-state-metrics reports *other* objects' namespace/pod/node labels, so they must be
    # kept as-is (honor_labels) rather than overwritten by the scrape target's own labels.
    extraScrapeConfigs:
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    hosts:
      - name: vm.cluster.local
        path:
          - /
        port: http
    pathType: Prefix
