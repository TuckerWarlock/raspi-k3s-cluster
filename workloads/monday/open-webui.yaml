apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: monday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi4controller
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:v0.9.2
        ports:
        - name: web
          containerPort: 8080
        env:
        - name: OLLAMA_BASE_URL
          value: "http://ollama:11434"
        # Disable sign-up — single-user personal assistant
        - name: WEBUI_AUTH
          value: "false"
        # Ollama on Pi 4 takes 2+ min to load model from USB on first request.
        # Set a long timeout so open-webui doesn't cancel before model is ready.
        - name: AIOHTTP_CLIENT_TIMEOUT
          value: "300"
        - name: AIOHTTP_CLIENT_TIMEOUT_TOOL_CALL
          value: "300"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1536Mi
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        # On first boot, open-webui downloads ~30 files from HuggingFace before
        # the web server starts. startupProbe allows up to 5 minutes for this;
        # once it passes, the tighter liveness/readiness probes take over.
        # timeoutSeconds:30 — the / endpoint is slow to respond during initial DB
        # migrations and model loading even after port 8080 is open.
        startupProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 30
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: monday
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: monday
spec:
  selector:
    app: open-webui
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: web
