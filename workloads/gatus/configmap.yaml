# Gatus endpoint checks. Edit here; ArgoCD syncs it and Gatus reloads config.yaml
# automatically when the mounted ConfigMap changes (no pod restart needed).
#
# Note: *.cluster.local can't be resolved from inside pods (cluster.local is the
# Kubernetes service domain), so in-cluster apps are checked via their Service DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    metrics: true

    storage:
      type: sqlite
      path: /data/data.db

    ui:
      title: Cluster Status
      header: raspi-k3s-cluster

    # Push failures and recoveries to the iPhone via ntfy (in-cluster Service, so no TLS
    # or DNS needed). NTFY_TOKEN comes from the gatus-ntfy Secret — created by hand,
    # see bootstrap/docs/rebuild.md step 3.8. Until it exists, alerts fail with 403.
    alerting:
      ntfy:
        url: "http://ntfy.ntfy.svc"
        topic: "cluster-status"
        token: "${NTFY_TOKEN}"
        priority: 4
        default-alert:
          # ~3 minutes down before alerting; 2 good checks to resolve
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      # --- Cluster core ---
      - name: k3s-api
        group: cluster
        # In-cluster API Service: works regardless of the controller's LAN IP
        url: "tcp://kubernetes.default.svc:443"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[CONNECTED] == true"

      - name: traefik
        group: cluster
        # Traefik's LoadBalancer IP from MetalLB; any non-5xx means it's routing
        url: "http://192.168.1.241"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] < 500"

      - name: argocd
        group: cluster
        url: "http://argocd-server.argocd.svc/healthz"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] == 200"

      - name: victoria-metrics
        group: cluster
        url: "http://victoria-metrics-victoria-metrics-single-server.monitoring.svc:8428/health"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] == 200"

      - name: vmalert
        group: cluster
        url: "http://vmalert-victoria-metrics-alert-server.monitoring.svc:8880/health"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] == 200"

      - name: alertmanager
        group: cluster
        url: "http://vmalert-victoria-metrics-alert-alertmanager.monitoring.svc:9093/-/healthy"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] == 200"

      - name: ntfy
        group: cluster
        url: "http://ntfy.ntfy.svc/v1/health"
        interval: 1m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] == 200"
          - "[BODY].healthy == true"

      # --- Home network ---
      - name: pihole-dns
        group: network
        url: "192.168.1.158"
        interval: 1m
        alerts:
          - type: ntfy
        dns:
          query-name: "example.com"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"

      - name: pihole-admin
        group: network
        url: "http://192.168.1.158/admin/"
        interval: 5m
        alerts:
          - type: ntfy
        conditions:
          - "[STATUS] < 400"
